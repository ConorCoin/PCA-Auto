name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [app/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push app/ to gh-pages
        run: git subtree push --prefix app origin gh-pages

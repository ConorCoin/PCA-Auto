<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCA Field Capture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCA">
<style>
  :root { --g: #0b5d3b; --lg: #e6efe9; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 0 0 40px; max-width: 560px; margin-inline: auto; background: #fff; color: #111; }
  header { position: sticky; top: 0; background: #fff; padding: 10px 12px; border-bottom: 1px solid #ddd; z-index: 5; }
  h1 { font-size: 15px; margin: 0 0 6px; color: #555; font-weight: 600; }
  .row { display: flex; gap: 6px; }
  .row > * { margin: 0; }
  button, .btn, select, textarea, input[type=text] { box-sizing: border-box; font-size: 17px; }
  button, .btn { padding: 14px; background: var(--g); color: #fff; border: 0; border-radius: 10px; text-align: center; cursor: pointer; }
  button.alt, .btn.alt { background: var(--lg); color: var(--g); }
  button.small { padding: 6px 10px; font-size: 14px; border-radius: 6px; }
  button.chip { flex: 1; padding: 10px 4px; font-size: 15px; background: var(--lg); color: var(--g); border: 2px solid var(--g); }
  button.chip.on { background: var(--g); color: #fff; }
  #text { margin-top: 8px; }
  button:disabled { opacity: .5; }
  #section { flex: 1; min-width: 0; padding: 12px 8px; font-size: 17px; font-weight: 600; border: 2px solid var(--g); border-radius: 10px; background: #fff; }
  #prev, #next { width: 52px; padding: 12px 0; font-size: 22px; }
  #counts { font-size: 13px; color: #555; margin-top: 6px; }
  .pad { padding: 0 12px; }
  .big { flex: 1; padding: 26px 8px; font-size: 20px; font-weight: 600; }
  .actions { margin: 12px 0; }
  #notebox { margin: 8px 0; }
  textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid #bbb; border-radius: 8px; }
  .hint { font-size: 13px; color: #555; margin: 4px 0 6px; }
  #status { min-height: 1.3em; font-size: 14px; color: #555; margin: 4px 0; }
  .item { border-top: 1px solid #ddd; padding: 10px 0; font-size: 15px; }
  .item img { width: 100%; border-radius: 8px; display: block; margin-bottom: 6px; }
  .item input[type=text] { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; }
  .tag { display: inline-block; background: var(--lg); border-radius: 4px; padding: 1px 6px; font-size: 13px; margin-bottom: 4px; }
  .tools { display: flex; gap: 6px; margin-top: 6px; }
  .tools select { flex: 1; min-width: 0; font-size: 14px; padding: 4px; }
  #setup { padding: 12px; }
  #setup input[type=text] { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 8px; border: 1px solid #bbb; border-radius: 8px; }
  #setup button.job { width: 100%; margin-bottom: 6px; text-align: left; }
  .foot { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .block { display: block; width: 100%; margin: 6px 0; }
  [hidden] { display: none !important; }
  details { margin-top: 14px; font-size: 14px; }
  details summary { cursor: pointer; padding: 6px 0; color: #555; }
</style>
</head>
<body>
<header>
  <h1 id="title">PCA Capture</h1>
  <div id="bar" class="row" hidden>
    <button id="prev" class="alt" aria-label="Previous section">&lsaquo;</button>
    <select id="section" aria-label="Current section"></select>
    <button id="next" class="alt" aria-label="Next section">&rsaquo;</button>
  </div>
  <div id="counts"></div>
</header>

<div id="setup" hidden>
  <div id="joblist"></div>
  <div class="hint">New assessment. The name and address print under every photo.</div>
  <input id="jobname" type="text" placeholder="Property name (e.g. Porsche Atlanta Northwest)">
  <input id="jobaddr1" type="text" placeholder="Street address (e.g. 2501 Windy Hill Road SE)">
  <input id="jobaddr2" type="text" placeholder="City, State Zip (e.g. Marietta, GA 30067)">
  <button id="startjob" class="block">Start new assessment</button>
</div>

<div id="main" class="pad" hidden>
  <div class="actions row">
    <label class="btn big">Photo
      <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <button id="note" class="alt big">Note</button>
  </div>
  <div id="notebox" hidden>
    <div class="hint">This note is the:</div>
    <div class="row" id="types">
      <button class="chip small" data-type="description">Description</button>
      <button class="chip small" data-type="condition">Condition</button>
      <button class="chip small" data-type="rec">Recommendation</button>
    </div>
    <div class="row" id="tiers" style="margin-top:6px" hidden>
      <button class="chip small" data-tier="immediate">Immediate</button>
      <button class="chip small" data-tier="short">Short-Term</button>
      <button class="chip small" data-tier="long">Long-Term</button>
    </div>
    <textarea id="text" placeholder="Type, or tap the microphone on your keyboard to talk"></textarea>
    <div class="hint">To dictate: tap the microphone key on your phone keyboard.</div>
    <div class="row">
      <button id="savenote">Save note</button>
      <button id="cancelnote" class="alt">Cancel</button>
    </div>
  </div>
  <div id="status"></div>
  <div class="foot"><label><input id="onlyhere" type="checkbox" checked> Only this section</label></div>
  <button id="prep" class="alt block">Prepare Word report</button>
  <button id="saveReport" class="block" hidden>Save report</button>
  <div id="items"></div>
  <details>
    <summary>More</summary>
    <div class="hint">Property shown under every photo:</div>
    <input id="edname" type="text" placeholder="Property name" style="width:100%;padding:10px;margin-bottom:6px;border:1px solid #bbb;border-radius:8px">
    <input id="edaddr1" type="text" placeholder="Street address" style="width:100%;padding:10px;margin-bottom:6px;border:1px solid #bbb;border-radius:8px">
    <input id="edaddr2" type="text" placeholder="City, State Zip" style="width:100%;padding:10px;margin-bottom:6px;border:1px solid #bbb;border-radius:8px">
    <button id="savedetails" class="alt block">Save property details</button>
    <button id="switch" class="alt block">Switch or start another assessment</button>
    <button id="backup" class="alt block">Save a backup file</button>
    <label class="btn alt block">Restore from backup file
      <input id="restore" type="file" accept="application/json,.json" hidden>
    </label>
  </details>
</div>

<script src="vendor/docx.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
